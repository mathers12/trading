name: Ceny (jednorazové stiahnutie)

on:
  push:
    branches: [claude/upbeat-mendel-pb4z5v]
    paths: [.github/workflows/prices.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: Stiahnutie M1 z Dukascopy a uloženie ako M1 CSV
        run: |
          python - <<'PY'
          import pandas as pd, numpy as np, lzma, time, requests, os
          REC=np.dtype([("t",">u4"),("o",">u4"),("c",">u4"),("l",">u4"),("h",">u4"),("v",">f4")])
          S=requests.Session(); S.headers['User-Agent']='Mozilla/5.0'
          os.makedirs('prices',exist_ok=True)
          days=[d for d in pd.date_range('2026-07-20','2026-08-31') if d.weekday()!=5]
          for ins in ['USA100IDXUSD','XAUUSD','XAGUSD','USDJPY']:
            fr=[]
            for d in days:
              url=f"https://datafeed.dukascopy.com/datafeed/{ins}/{d.year}/{d.month-1:02d}/{d.day:02d}/BID_candles_min_1.bi5"
              for a in range(15):
                try:
                  r=S.get(url,timeout=30)
                  if r.status_code==200: break
                except Exception: pass
                time.sleep(min(30,3*(a+1)))
              else: print('FAIL',ins,d,flush=True); continue
              if r.content:
                rec=np.frombuffer(lzma.decompress(r.content),dtype=REC)
                idx=d+pd.to_timedelta(rec['t'].astype(np.int64),unit='s')
                fr.append(pd.DataFrame({k:rec[k] for k in 'ohlcv'},index=idx))
              time.sleep(0.3)
            df=pd.concat(fr); df=df[df.v>0]
            df[list('ohlc')].to_csv(f'prices/{ins}_M1.csv.gz',index_label='t')
            print('DONE',ins,len(df),df.index.min(),df.index.max(),flush=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices
          git commit -m "Cenové dáta M1 (júl–august 2026) na analýzu obchodov" || exit 0
          git push
