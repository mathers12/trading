name: Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Od (YYYY-MM-DD)"
        default: "2024-01-01"
      end:
        description: "Do (YYYY-MM-DD, prázdne = dnes)"
        default: ""
      charts:
        description: "Počet grafov obchodov"
        default: "30"
      extra:
        description: "Zmeny nastavení, napr. --set filters.require_h4_crt=true"
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache historických dát
        uses: actions/cache@v4
        with:
          path: data
          key: m1-data-${{ github.run_id }}
          restore-keys: m1-data-
      - name: Backtest + porovnanie variantov
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          CHARTS: ${{ inputs.charts }}
          EXTRA: ${{ inputs.extra }}
        run: |
          ARGS="--start $START"
          if [ -n "$END" ]; then ARGS="$ARGS --end $END"; fi
          python -m smc_bot backtest $ARGS --charts "$CHARTS" --out reports/backtest $EXTRA
          python -m smc_bot compare $ARGS --out reports/compare $EXTRA
          cat reports/backtest/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/compare/compare.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/

