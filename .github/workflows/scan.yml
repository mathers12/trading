name: Skenovanie trhu

on:
  # Automatické skenovanie je vypnuté, kým stratégia nemá overenú výhodu.
  # Zapnutie: odkomentuj 2 riadky nižšie.
  # schedule:
  #   - cron: "*/10 6-17 * * 1-5"   # Po–Pi 08:00–19:00 slovenského času
  workflow_dispatch:
    inputs:
      test:
        description: "Poslať testovaciu správu na Telegram"
        type: boolean
        default: true

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Obnov stav (ktoré upozornenia už odišli)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: scan-state-${{ github.run_id }}
          restore-keys: scan-state-
      - name: Obnov Dukascopy dáta
        uses: actions/cache/restore@v4
        with:
          path: data
          key: scan-data-${{ github.run_id }}
          restore-keys: scan-data-
      - name: Skenuj a pošli upozornenia
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFY: ${{ inputs.test && '--test-notify' || '' }}
        run: python -m smc_bot scan $TEST_NOTIFY
      - name: Ulož stav
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: scan-state-${{ github.run_id }}
      - name: Ulož Dukascopy dáta
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: scan-data-${{ github.run_id }}
